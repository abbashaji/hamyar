  TASK R4-03: Rows 8, 11, 13, 19. Read 15b..15f for the four operations of row 13 first. Row 8 (D-18, D-18a, D-38): in 10a the recovery key is shown after the member''s first accepted cell, not at the end of registration: change the registration pseudocode, the text at 10.3.1, item 5 of 10.4.2 and AC-identity-04; the client holds the recovery secret in device storage from registration until the member confirms the key and wipes it then; it is never sent to the server; update the statement that it is never stored to say exactly that. Row 11: rewrite 15a 15.3 (challenge paragraph) to the seven purposes of 10a (create, session, rotate, recover, device_link, step_up, confirm_recovery) and the signed `sig_input` of 10a (audience and context_hash); delete the sentence that `create` and `device_link` carry no server challenge; keep the pointer to S10 for crypto detail. Row 13: confirm each of createSessionRevocation, exportMe, confirmRecoveryKey, closeMember exists as an operation in 15a to 15f (15c lists confirmRecoveryKey and closeMember as NEW rows; revokeSession and exportMe are in 15c 15.B.5); if one exists only in 15c, state in the 15a identity table that it is defined in 15c with the 15c id; rename the 10a and 11a ids to the 15a ids (10a says S15 is authoritative): deleteSession/revokeSession, createRecovery/recoverMember, putMemberEmail/setEmail, deleteMemberEmail/removeEmail, deleteInvite/revokeInvite, and the 11a 11.5.1 ids (getMember, createDeviceLinkCode, redeemDeviceLinkCode, rotateMemberKey, rotateRecoveryKey, startRecovery, completeRecovery) to the ids 15a/15c define for the same paths; add `checkInvite` to 10a 10.6. Row 19: add `rejectApproval`, `withdrawApproval` to 10a 10.18.1 and the events `admin.approval_rejected`, `admin.approval_withdrawn` to 10.18.2 (ids and events as S15b 15.21-15.22 and 15.34).

