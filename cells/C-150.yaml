goal: 'You apply a fixed list of audit findings to spec parts and write docs/fix/R3-13.md. SOURCES: docs/audit/FINAL-2.md (the ''Findings'' table: each row you are assigned states file:line, defect and the proposed fix; READ each of your rows first), docs/owner-decisions.md (the owner''s accepted decisions D-01..D-34: they are binding, apply them, never invent another choice), and the parts named below. AUTHORITY WHEN SOURCES CONFLICT: docs/owner-decisions.md, then the Founding Document, then S0 (spec/00-conventions.md), then the part that owns the concept per D-30 (entities and columns: S5a; enums and states: S0; operations and paths: S15a/S15b; copy keys for requester rejections: S7), then all other parts. METHOD: for each assigned row, locate the cited text by reading about 30 lines around the cited line (lines drift; search nearby, never guess); make the MINIMAL edit in place (apply_changes with small old/new strings; never rewrite sections, never delete content that is not part of the fix); after an edit, check that every other place in YOUR files that states the same fact now agrees (search by reading the neighbouring sections and any table that repeats it); do not touch anything not named by your rows; if you notice another defect list it under ''## Noticed, not fixed'' with file:line and do not fix it. Names: edits may change only the identifiers your row says to change; never rename any other id, parameter, endpoint, state or enum; never mention retired names in the new text. If an edit would contradict the Founding Document, a ground rule of docs/decisions.md or a decision of docs/owner-decisions.md, do not make it: record skipped-needs-owner with the reason. STATUS WORDS: applied / already-applied / skipped-needs-owner / skipped-not-found (with what you searched). LOG docs/fix/R3-13.md: a table with columns exactly: edit | file:line | before | after | status (one row per edit, row numbers of FINAL-2 in the first column), then ''## Read-back'' (after ALL edits re-open every edited place and state in a phrase what you now read; also state, for each row, which other places you checked for the same fact), then ''## Noticed, not fixed'', then a last line ''Result: DONE'' or ''Result: DONE WITH SKIPS''. Mark every edit that follows a decision as default-pending in the ''after'' column. Do not run anything; CI runs the acceptance commands.


  TASK R3-13: Rows 15, 33, 52, 53, 67. Row 33: in spec/15c 15.B.2 the row `/v1/policy` must become verdict ALIAS of `getPublicPolicy` (the path is `GET /v1/public/policy`, 15.B.8.1); keep exactly one NEW row `/v1/public/policy` and place it in alphabetical order (after `/v1/public/health`). Row 15: add to the event catalogue 15b 15.34 the events that operations use and the catalogue lacks: `calibration.report_frozen` (createCalibrationReport, 15f 15.E.5), `workclaim.expired` (AC-claim-02, 11c), `decision_report.created`, `incident.recorded`, `incident.resolved`, `interview.recorded` (read 15e/15f for their payloads and producers; use the 15b event format). Row 52: extend the list at 15.34.5 of event names not in S0 0.9 with every event FIX-14 added (`job.cancelled`, `experiment.registered`, `experiment.assigned`, `experiment.exposed`, `team.locked`, `team.unlocked`, and the six of row 15). Row 53: 15b 15.29.7 now defines `createAppeal`, `listAppeals`, `getAppeal`, `withdrawAppeal`: mark the same rows in 15d as ''moved to 15b 15.29.7'' (state in each row; keep the verdict word of the row unchanged so the checks stay valid). Row 67: edits 25 and 27 of 15c remain instructions for a later cell: for each, read the cited place in the part and record in 15c''s status note whether it is applied (do not apply edits to part files in this cell).

