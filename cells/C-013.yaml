id: C-013
title: 'Section 11a: volunteer experience screens'
type: normal
priority: 5
goal: 'Write spec/11a-volunteer-ux.md (prompt scope F volunteer): screen-by-screen specification, mobile-first, no install, Persian first (RTL) plus English: landing, first contribution flow (the sub-60-second path: step list with time budget labeled [H]), the cell card (purpose, license, sensitivity, service, template, expected time, one-sentence provenance line, expandable full prompt, mandatory expansion rules for first use of a template and non-default categories, decline and report buttons), copy and open-in-service buttons through the service-adapter layer (prefill only where a registry entry says supported, copy-only otherwise; never reading the chat page), paste-back, result feedback (accepted / rejected with reason / flagged), balance and expiry view (lots with expiry dates), history, opt-in settings, teams, share card, invite flow, recovery key handling, appeal, help. For each screen: purpose, entry conditions, layout/content blocks, states (empty, loading, error, offline/low-bandwidth,
  blocked), actions, API calls (names only, per 00-conventions), copy intent, accessibility notes, and Given/When/Then acceptance criteria. Use text wireframes. Copy that makes a promise says ''declared'', never ''guaranteed''.

  '
inputs:
- from: C-000
  kind: contract
  contract: spec/00-conventions.md fixes entity names, ID formats, enums, state names, parameter names (snake_case, prefix by area), API prefix /v1, evidence-tag usage and cross-reference style. Use them exactly; if one is wrong or missing call cell_signal feedback, do not invent a variant.
after:
- C-000
read:
- docs/decisions.md
- docs/source/Hamyar - Founding Document.md
- docs/source/prompt.md
- spec/00-conventions.md
allowed_paths:
- spec/11a-volunteer-ux.md
outputs:
- spec/11a-volunteer-ux.md
acceptance:
- cmd: python scripts/check_spec.py spec/11a-volunteer-ux.md --min-lines 300 --min-tags 8 --require 'wireframe' --require 'paste-back' --require 'Given'
notes: 'Document cell: write markdown only, in several appends/commits. Do not summarize away required items; every bullet of the named prompt scope letters must appear as a decision, table, schema, pseudocode or Given/When/Then. Founding Document section numbers are §N. Mark facts you cannot know [V].'
