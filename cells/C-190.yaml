goal: 'You apply a fixed list of audit findings to spec parts and write docs/fix/R5-08.md. SOURCES: docs/audit/FINAL-4.md (the ''Findings'' table; rows 1-66: each row you are assigned states file:line, defect and the proposed fix; READ each of your rows first), docs/owner-decisions.md (the owner''s accepted decisions D-01..D-44: they are binding, apply them, never invent another choice), and the parts named below. AUTHORITY WHEN SOURCES CONFLICT: docs/owner-decisions.md, then the Founding Document, then S0 (spec/00-conventions.md), then the part that owns the concept per D-30 (entities and columns: S5a; enums and states: S0; operations and paths: S15a/S15b; copy keys for requester rejections: S7), then all other parts. METHOD: for each assigned row, locate the cited text by reading about 30 lines around the cited line (lines drift; search nearby, never guess); make the MINIMAL edit in place (apply_changes with small old/new strings; never rewrite sections, never delete content that is not part of the fix); after an edit, check that every other place in YOUR files that states the same fact now agrees (search by reading the neighbouring sections and any table that repeats it); do not touch anything not named by your rows; if you notice another defect list it under ''## Noticed, not fixed'' with file:line and do not fix it. Names: edits may change only the identifiers your row says to change; never rename any other id, parameter, endpoint, state or enum; never mention retired names in the new text. If an edit would contradict the Founding Document, a ground rule of docs/decisions.md or a decision of docs/owner-decisions.md, do not make it: record skipped-needs-owner with the reason. STATUS WORDS: applied / already-applied / skipped-needs-owner / skipped-not-found (with what you searched). LOG docs/fix/R5-08.md: a table with columns exactly: edit | file:line | before | after | status (one row per edit, row numbers of FINAL-4 in the first column), then ''## Read-back'' (after ALL edits re-open every edited place and state in a phrase what you now read; also state, for each row, which other places you checked for the same fact), then ''## Noticed, not fixed'', then a last line ''Result: DONE'' or ''Result: DONE WITH SKIPS''. Mark every edit that follows a decision as default-pending in the ''after'' column. Do not run anything; CI runs the acceptance commands.


  TASK R5-08: Row 27 of FINAL-4. Run, by reading, the check scripts/check_opids.py logic over your files: every backticked verb-prefixed camelCase id (get/list/create/update/delete/put/set/redeem/revoke/approve/reject/withdraw/confirm/... ) must be an operation that S15a/S15b define (a table row with a backticked id and a backticked METHOD /v1 path) or a NEW row of 15c..15g. Known offenders: 04 (`confirmEscrow`, `submitJob`), 06b (`confirmJobQuote`, `getAdminCapacity`), 07 (`approvePolicyVersion`, `createPolicyVersionDraft`, `recordFlagAnswer`, `withdrawPolicyVersion`), 09 (`rotateLeaseNonce`), 12 (`getPublicMilestone`, `getReferral`, `getShareCardPayload`), 13 (`createCalibrationRecords`), 11c (`approveTemplateVersion`, `rejectTemplateVersion`, `createCellOverturn`, `createLedgerVerification`, `createTemplateVersionComment`, `getTermsCopyContent`, `listAdminMetricSnapshots`, `recordFlagAnswer`, `withdrawParameterVersion`). For each: find the S15 id for the same function (read 15a, 15b and the rename rows of 15c..15g: the new id is in the row) and write it; if S15 has no operation for it, do NOT invent one: write the function in words with no id and list it under ''## Noticed, not fixed'' as `no S15 operation: <old id> <file:line> <function>` (the last cell records these as known issues). `createCellOverturn` is a single-admin action per D-39. Search every one of your files for other offenders of the same shape that I did not list. ROUND-5 RULES: (1) The rows of docs/audit/FINAL-4.md state defect and action; where an owner decision (D-35, D-39..D-44 in docs/owner-decisions.md) names the choice, it overrides the row''s proposal. (2) SIBLING RULE: after every edit, open EVERY other file and line that states the same fact (the row names them; search the parts listed in your read list with the key words of the fact) and make them agree in the same cell; if a sibling is outside your allowed files, list it under ''## Noticed, not fixed'' with file:line. (3) Write each fact once in its owner part and point from the others where the row allows. (4) Never reintroduce a retired name; never cite an operation id that S15a/S15b (or a NEW row of 15c..15g) does not define. (5) Line numbers in the rows are approximate: search near them.

