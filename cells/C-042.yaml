id: C-042
title: 'Audit A01: 06a-ledger'
type: normal
priority: 5
goal: 'You are an INDEPENDENT adversarial reviewer of the files listed below (spec parts of the Hamyar Product Specification, written by other agents). Task statement: docs/source/prompt.md; source of truth: the Founding Document (FD); shared names: spec/00-conventions.md (S0). Method: read your files completely in chunks; for each checklist item below look for concrete defects (wrong arithmetic, contradiction inside the file or with S0/FD, missing required content from the prompt scope named, ground-rule violation, untestable criterion, unlabeled number, invented provider/legal fact, name that S0 does not define). FIX each defect you can with a minimal edit in place (apply_changes edits, never whole-file rewrites; keep every ID, endpoint, parameter and state name). Defects that need a change in another file, or a decision only the owner can make, are LOGGED, not worked around. Write the log docs/audit/A01.md with: ''## Checked'' (bullets: what you examined and found correct, so the reader knows coverage), ''## Findings'' (table columns exactly: # | severity (blocking/major/minor) | file:line | defect | action (fixed / logged-cross-part / logged-needs-owner) ), ''## Not verified'' (what you could not check), and a last line ''Verdict: READY'' or ''Verdict: READY WITH LOGGED ITEMS'' or ''Verdict: NOT READY'' (NOT READY if any blocking finding is unfixed). Do not praise; do not pad; if you find nothing in an area say what you checked. Cap: fix at most the 25 most severe defects; log the rest as a count with the top 5.

  FILES UNDER AUDIT: spec/06a-ledger.md

  CHECKLIST:

  - Do the FD section 3.3 arithmetic yourself, step by step, from the numeric representation and posting rules the file states (price 1+v+lambda, escrow 276, donors 264, Reserve 12, Sara keeps 24, 300 credits earned, none expired): every figure in the file''s worked example and test spec must match; show your recomputation in the log.

  - Every posting table: sum of debits equals sum of credits for each entry type (mint, escrow hold/release, settle, refund, levy, expire, retire, grant); name any that does not balance.

  - FD section 4.2 invariants: for each flow (including expiry of partly spent lots, retirement above ceiling, refund after partial completion, starter grant from an empty Reserve, rounding of the levy in integer micro-credits) show whether credit can be created or destroyed; the rounding rule must name where the remainder goes.

  - Oldest-first spending across lots with different expiry dates; per-member cap K applies to unexpired credit including or excluding escrow? (state which and whether the file is consistent).

  - v measurement: window, minimum sample, behaviour below the minimum, per job type; eta and claim ratio formulas; prospective-only change rule.

  - Honesty about the FD gaps (starter grant and levy vs ''every unit traces to a Commons cell''; fractional price).

  '
