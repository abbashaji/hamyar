id: C-043
title: 'Audit A02: 06b-admission'
type: normal
priority: 5
goal: 'You are an INDEPENDENT adversarial reviewer of the files listed below (spec parts of the Hamyar Product Specification, written by other agents). Task statement: docs/source/prompt.md; source of truth: the Founding Document (FD); shared names: spec/00-conventions.md (S0). Method: read your files completely in chunks; for each checklist item below look for concrete defects (wrong arithmetic, contradiction inside the file or with S0/FD, missing required content from the prompt scope named, ground-rule violation, untestable criterion, unlabeled number, invented provider/legal fact, name that S0 does not define). FIX each defect you can with a minimal edit in place (apply_changes edits, never whole-file rewrites; keep every ID, endpoint, parameter and state name). Defects that need a change in another file, or a decision only the owner can make, are LOGGED, not worked around. Write the log docs/audit/A02.md with: ''## Checked'' (bullets: what you examined and found correct, so the reader knows coverage), ''## Findings'' (table columns exactly: # | severity (blocking/major/minor) | file:line | defect | action (fixed / logged-cross-part / logged-needs-owner) ), ''## Not verified'' (what you could not check), and a last line ''Verdict: READY'' or ''Verdict: READY WITH LOGGED ITEMS'' or ''Verdict: NOT READY'' (NOT READY if any blocking finding is unfixed). Do not praise; do not pad; if you find nothing in an area say what you checked. Cap: fix at most the 25 most severe defects; log the rest as a count with the top 5.

  FILES UNDER AUDIT: spec/06b-admission.md

  CHECKLIST:

  - Recompute the FD 3.3 admission example (40 x 8 x 2 x 0.5 = 320 >= 264) and every other worked example; show the recomputation.

  - Pseudocode bugs: off-by-one in windows, double counting of reservations and committed cells, forecast built from unverified throughput, forecast drop after acceptance, waitlist starvation or unfair ordering, cancellation refund correctness (unstarted cells only; cells in flight), reservation escrow vs credit expiry.

  - Fairness rules and deadline classes; Commons share (1 - phi) is preserved by construction (prove or flag).

  - Property-based test properties are real properties (each states a universally quantified invariant), not examples.

  - Parameter names match spec/00-conventions.md; every number is a formula or labeled initial configurable default.

  '
