goal: 'You are an INDEPENDENT adversarial reviewer of the files listed below (spec parts of the Hamyar Product Specification, written by other agents). Task statement: docs/source/prompt.md; source of truth: the Founding Document (FD); shared names: spec/00-conventions.md (S0). Method: read your files completely in chunks; for each checklist item below look for concrete defects (wrong arithmetic, contradiction inside the file or with S0/FD, missing required content from the prompt scope named, ground-rule violation, untestable criterion, unlabeled number, invented provider/legal fact, name that S0 does not define). FIX each defect you can with a minimal edit in place (apply_changes edits, never whole-file rewrites; keep every ID, endpoint, parameter and state name). Defects that need a change in another file, or a decision only the owner can make, are LOGGED, not worked around. Write the log docs/audit/A04.md with: ''## Checked'' (bullets: what you examined and found correct, so the reader knows coverage), ''## Findings'' (table columns exactly: # | severity (blocking/major/minor) | file:line | defect | action (fixed / logged-cross-part / logged-needs-owner) ), ''## Not verified'' (what you could not check), and a last line ''Verdict: READY'' or ''Verdict: READY WITH LOGGED ITEMS'' or ''Verdict: NOT READY'' (NOT READY if any blocking finding is unfixed). Do not praise; do not pad; if you find nothing in an area say what you checked. Cap: fix at most the 25 most severe defects; log the rest as a count with the top 5.

  FILES UNDER AUDIT: spec/10a-identity.md, spec/10b-safety.md

  CHECKLIST:

  - Member safety in a high-risk context: for every datum named in the logging table, check that the entities (spec/05a-entities.md, read its Member, Device, Session, Invite and Audit tables) and any rate-limit design do not store more (IP, device fingerprints, e-mail, timestamps granularity, salts); report contradictions as logged-cross-part with file:line in both files.

  - Salt scope of the volunteer hash ID; deanonymization paths (timing, invite trees, public ledger, share cards, teams); what exists to disclose on subpoena or seizure is stated exactly; promises exceeding what can be shown (FD Principle 11) are rewritten as declared or removed.

  - Recovery key design is sound (entropy source, not stored, rotation); account recovery abuse; device linking; sessions; admin authentication has no shared password and the two-person rule has a stated fallback for one admin.

  - Threat model table has all rows the prompt lists (forged results, credit farming, fake accounts and invite trees, malicious requesters and inputs, prompt injection, XSS, ledger tampering, insider and operator, account takeover, de-anonymization, compelled disclosure, DoS, reviewer capture) with a residual risk each.

  - Secrets inventory covers PANEL_TOKEN, ADMIN_TOKEN, GITHUB_TOKEN, MCP_AUTH_TOKEN and rotation before public exposure is a launch-gate item.

  '
