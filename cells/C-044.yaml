id: C-044
title: 'Audit A03: 14-launch-gates, 07-policy'
type: normal
priority: 5
goal: 'You are an INDEPENDENT adversarial reviewer of the files listed below (spec parts of the Hamyar Product Specification, written by other agents). Task statement: docs/source/prompt.md; source of truth: the Founding Document (FD); shared names: spec/00-conventions.md (S0). Method: read your files completely in chunks; for each checklist item below look for concrete defects (wrong arithmetic, contradiction inside the file or with S0/FD, missing required content from the prompt scope named, ground-rule violation, untestable criterion, unlabeled number, invented provider/legal fact, name that S0 does not define). FIX each defect you can with a minimal edit in place (apply_changes edits, never whole-file rewrites; keep every ID, endpoint, parameter and state name). Defects that need a change in another file, or a decision only the owner can make, are LOGGED, not worked around. Write the log docs/audit/A03.md with: ''## Checked'' (bullets: what you examined and found correct, so the reader knows coverage), ''## Findings'' (table columns exactly: # | severity (blocking/major/minor) | file:line | defect | action (fixed / logged-cross-part / logged-needs-owner) ), ''## Not verified'' (what you could not check), and a last line ''Verdict: READY'' or ''Verdict: READY WITH LOGGED ITEMS'' or ''Verdict: NOT READY'' (NOT READY if any blocking finding is unfixed). Do not praise; do not pad; if you find nothing in an area say what you checked. Cap: fix at most the 25 most severe defects; log the rest as a count with the top 5.

  FILES UNDER AUDIT: spec/14-launch-gates.md, spec/07-policy.md

  CHECKLIST:

  - TOP CONSTRAINT of the prompt: building vs launching. Enumerate every code path or API in these files that can create a job, admit a member, mint credit, lease a cell, or show a cell to a volunteer, and verify each checks (a) the global switch, (b) service state ''unreviewed counts as no'', (c) a reviewer-recorded flag set with a saved terms copy. Look for bypasses: seeds and migrations, admin or founder or test accounts, background jobs, Commons backlog creation, fail-open defaults, revoke-versus-lease race, switches default state on a fresh database.

  - The exit rule of FD 8.3 is encoded as a machine check, and sign-off cannot be forged by one person (two-person rule: what happens with ONE admin?).

  - Policy: rules R1-R10 are DATA evaluated by a small evaluator; find any rule that needs code outside it; R9 re-check and in-flight behaviour; allowlist of permitted combinations against the FD 5.7(5) two-profile limit; every rejection reason exists in EN and FA keys; injection screening rules are concrete.

  - Ground rule 2: no provider fact stated as fact; every such dependency is [V] with a storage location.

  '
