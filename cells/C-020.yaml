id: C-020
title: 'Section 15a: API specification, identity, cells, jobs'
type: normal
priority: 5
goal: 'Write spec/15a-api-core.md (prompt scope J API): endpoint tables with method, path under /v1, auth, request schema, response schema, error codes, idempotency, pagination, rate-limit class — for: identity (create, challenge, session, recovery, device link, rotate, invite create/redeem), volunteer cells (list offered cells honoring opt-ins, lease, decline, report, submit, history, balance/lots), requester jobs (templates list, upload and screen, declare metadata, policy check, quote, confirm with escrow, progress, cancel, results, manifest, rating, reservations), teams/share/referral. Include the common error model, the full error-code catalogue (stable codes), idempotency-key semantics per endpoint, pagination, auth header schemes, rate-limit classes and headers, versioning policy. JSON-schema-ish request/response for each endpoint (concise), plus three worked request/response examples (lease, submit, create job).

  '
inputs:
- from: C-000
  kind: contract
  contract: spec/00-conventions.md fixes entity names, ID formats, enums, state names, parameter names (snake_case, prefix by area), API prefix /v1, evidence-tag usage and cross-reference style. Use them exactly; if one is wrong or missing call cell_signal feedback, do not invent a variant.
after:
- C-000
read:
- docs/decisions.md
- docs/source/Hamyar - Founding Document.md
- docs/source/prompt.md
- spec/00-conventions.md
allowed_paths:
- spec/15a-api-core.md
outputs:
- spec/15a-api-core.md
acceptance:
- cmd: python scripts/check_spec.py spec/15a-api-core.md --min-lines 300 --min-tags 8 --require '/v1/' --require 'Idempotency-Key' --require 'error'
notes: 'Document cell: write markdown only, in several appends/commits. Do not summarize away required items; every bullet of the named prompt scope letters must appear as a decision, table, schema, pseudocode or Given/When/Then. Founding Document section numbers are §N. Mark facts you cannot know [V].'
