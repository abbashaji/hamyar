  TASK R5-05b: Rows 19, 53, 54, 55, 59, 60 of FINAL-4 (D-03, D-30). Row 19: the last bullet of 5.29.8 gets the closed-escrow rule of 06a 6.6.3 (refused with STATE_CONFLICT, logged `ledger.reversal_refused`, no restitution while `appeal_restitution` is off). Row 59: ISS-56 restated as D-03, status proposed. Row 60: CT-17 reverses what is held and records `shortfall_ucr`, and refuses only for a closed escrow (as 06a 6.6.3). Rows 53, 54, 55: `mint_headroom`: 05a says `row_version` is bumped by every update and the guard is the headroom predicate; field table gets `row_version` and `updated_at`; 05b names the generated key and passes the lease issue time (`consume`) and the current time (`reserve`) and lets the function derive month and `member_day` keys; 06a 6.8.2 names `mint_headroom` as the store, the lock order, and says the 6.8.1 count excludes a flagged cell whose reservation CT-19 released. ROUND-5 RULES: (1) The rows of docs/audit/FINAL-4.md state defect and action; where an owner decision (D-35, D-39..D-44 in docs/owner-decisions.md) names the choice, it overrides the row''s proposal. (2) SIBLING RULE: after every edit, open EVERY other file and line that states the same fact (the row names them; search the parts listed in your read list with the key words of the fact) and make them agree in the same cell; if a sibling is outside your allowed files, list it under ''## Noticed, not fixed'' with file:line. (3) Write each fact once in its owner part and point from the others where the row allows. (4) Never reintroduce a retired name; never cite an operation id that S15a/S15b (or a NEW row of 15c..15g) does not define. (5) Line numbers in the rows are approximate: search near them.

