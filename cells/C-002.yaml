id: C-002
title: 'Section 4: system overview and architecture'
type: normal
priority: 5
goal: 'Write spec/04-architecture.md (prompt sections 4 and J): system overview diagram in text; stack-agnostic target architecture: components and their interfaces (identity service, ledger service, job/cell service, policy engine, service registry, template registry, verification pipeline, admission control, notification-free public site, admin tool, analytics pipeline, adapter layer), storage interfaces (ledger needs serializable transactions or equivalent: state the exact consistency requirement), background jobs (lease expiry, escrow settlement, credit expiry, audits, metric rollups, ledger invariant checks, reserve retirement, capacity forecast), event model, configuration management, feature flags, migrations, observability (logs without personal data, metrics, alerts), backup and recovery, deployment and environments (dev/test/staging/prod), the service-adapter interface (capabilities: supports_prefill, url_length_limit, copy_only, configured from the Service Registry; no provider
  hardcoded; the human always presses Send; no reading of the chat page), hosting/storage behind interfaces, no mandatory third-party CDN or font dependency, reachability from Iran [V]. Then the recommended concrete stack with reasons and a short list of alternatives (weigh Cloudflare Worker + D1/Durable Objects vs a conventional server + PostgreSQL; the ledger''s need for strong consistency and the hosting-reachability [V] must drive the choice). Then ''Existing panel: keep / wrap / replace'' using docs/source/panel-review.md as the fact base (cells, leases, status graph, bottleneck view, Release / Hand over, launcher, four secrets): a table with item, decision, reason, [V] condition. Do not assume undocumented panel behavior.

  '
inputs:
- from: C-000
  kind: contract
  contract: spec/00-conventions.md fixes entity names, ID formats, enums, state names, parameter names (snake_case, prefix by area), API prefix /v1, evidence-tag usage and cross-reference style. Use them exactly; if one is wrong or missing call cell_signal feedback, do not invent a variant.
after:
- C-000
read:
- docs/decisions.md
- docs/source/Hamyar - Founding Document.md
- docs/source/prompt.md
- docs/source/panel-review.md
- spec/00-conventions.md
allowed_paths:
- spec/04-architecture.md
outputs:
- spec/04-architecture.md
acceptance:
- cmd: python scripts/check_spec.py spec/04-architecture.md --min-lines 200 --min-tags 8 --require 'Service-adapter' --require 'keep' --require 'replace'
notes: 'Document cell: write markdown only, in several appends/commits. Do not summarize away required items; every bullet of the named prompt scope letters must appear as a decision, table, schema, pseudocode or Given/When/Then. Founding Document section numbers are §N. Mark facts you cannot know [V].'
