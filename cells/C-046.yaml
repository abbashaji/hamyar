goal: 'You are an INDEPENDENT adversarial reviewer of the files listed below (spec parts of the Hamyar Product Specification, written by other agents). Task statement: docs/source/prompt.md; source of truth: the Founding Document (FD); shared names: spec/00-conventions.md (S0). Method: read your files completely in chunks; for each checklist item below look for concrete defects (wrong arithmetic, contradiction inside the file or with S0/FD, missing required content from the prompt scope named, ground-rule violation, untestable criterion, unlabeled number, invented provider/legal fact, name that S0 does not define). FIX each defect you can with a minimal edit in place (apply_changes edits, never whole-file rewrites; keep every ID, endpoint, parameter and state name). Defects that need a change in another file, or a decision only the owner can make, are LOGGED, not worked around. Write the log docs/audit/A05.md with: ''## Checked'' (bullets: what you examined and found correct, so the reader knows coverage), ''## Findings'' (table columns exactly: # | severity (blocking/major/minor) | file:line | defect | action (fixed / logged-cross-part / logged-needs-owner) ), ''## Not verified'' (what you could not check), and a last line ''Verdict: READY'' or ''Verdict: READY WITH LOGGED ITEMS'' or ''Verdict: NOT READY'' (NOT READY if any blocking finding is unfixed). Do not praise; do not pad; if you find nothing in an area say what you checked. Cap: fix at most the 25 most severe defects; log the rest as a count with the top 5.

  FILES UNDER AUDIT: spec/05a-entities.md

  CHECKLIST:

  - Every entity in the prompt scope B list is present (Member, Device, Invite, Template, Job, Cell, Lease, Submission, Verification record, GoldCell, Audit, LedgerAccount, LedgerEntry, Escrow, Reserve, Policy, ServiceRegistryEntry with terms copies and dated flag answers, Report, Appeal, Reservation, Team, Badge, ChangeLogEntry, LaunchGateItem) with fields, types, constraints, indexes, retention.

  - DDL consistency: foreign keys reference real tables and columns, types match across tables, unique constraints support the idempotency claims, append-only tables have no UPDATE path (how corrections are modelled), indexes exist for every lookup the state machines need (read the headings of spec/05b-state-machines.md for the lookups).

  - Data minimization: nothing stores IPs, provider credentials, chat URLs or provider session data; the volunteer hash scope; retention rule for every table.

  - Entity and enum names equal S0 (spec/00-conventions.md 0.7, 0.8).

