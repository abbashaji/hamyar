goal: 'You are an INDEPENDENT adversarial reviewer of the files listed below (spec parts of the Hamyar Product Specification, written by other agents). Task statement: docs/source/prompt.md; source of truth: the Founding Document (FD); shared names: spec/00-conventions.md (S0). Method: read your files completely in chunks; for each checklist item below look for concrete defects (wrong arithmetic, contradiction inside the file or with S0/FD, missing required content from the prompt scope named, ground-rule violation, untestable criterion, unlabeled number, invented provider/legal fact, name that S0 does not define). FIX each defect you can with a minimal edit in place (apply_changes edits, never whole-file rewrites; keep every ID, endpoint, parameter and state name). Defects that need a change in another file, or a decision only the owner can make, are LOGGED, not worked around. Write the log docs/audit/A09.md with: ''## Checked'' (bullets: what you examined and found correct, so the reader knows coverage), ''## Findings'' (table columns exactly: # | severity (blocking/major/minor) | file:line | defect | action (fixed / logged-cross-part / logged-needs-owner) ), ''## Not verified'' (what you could not check), and a last line ''Verdict: READY'' or ''Verdict: READY WITH LOGGED ITEMS'' or ''Verdict: NOT READY'' (NOT READY if any blocking finding is unfixed). Do not praise; do not pad; if you find nothing in an area say what you checked. Cap: fix at most the 25 most severe defects; log the rest as a count with the top 5.

  FILES UNDER AUDIT: spec/11a-volunteer-ux.md, spec/11d-i18n-copy.md

  CHECKLIST:

  - Every screen the prompt scope F volunteer list names exists (landing, first contribution flow, cell card with mandatory expansion rules, copy and open-in-service via the adapter layer, paste-back, result feedback, balance and expiry, history, opt-ins, teams, share card, invite flow, recovery key, appeal, help), each with states and Given/When/Then.

  - Ground rule 3 in the UX: nothing automates the volunteer''s account or reads the chat page; prefill only where a registry entry says it is supported; copy-only otherwise; the human presses Send.

  - Persian copy: read every Persian string as a native reader would; correct grammar, natural phrasing, ZWNJ usage; every promise-like sentence says declared (اعلام‌شده), never guaranteed (تضمین) except in negations; all notices present in FA and EN and marked ''needs human and legal review''.

  - RTL and mixed-direction rules are concrete (isolation, dir=auto, bidi controls policy); fonts self-hosted; low-bandwidth budgets labeled as initial configurable defaults; accessibility criteria testable.

  '
