id: C-011
title: 'Section 10a: identity, access, sessions, privacy'
type: normal
priority: 5
goal: 'Write spec/10a-identity.md (prompt scope A and I privacy): anonymous local identity with no signup/e-mail (keypair generation in the browser, what the server stores, proof of possession / challenge-response, no passwords), recovery key design (format, entropy source, display, offline backup, how it is verified without storing the secret, rotation), optional e-mail (what it is used for, hashing/encryption, risks), key rotation, device linking (QR/code flow, limits), account recovery and its abuse risks (takeover, farming via re-recovery, rate limits), per-device, per-invite-tree and per-day rate limits (parameters, how a ''device'' is identified WITHOUT fingerprinting that harms privacy — state the tradeoff), vouched invitations and invite trees (quotas, accountability when a descendant is banned, anti-farming), roles Donor/Requester/Reviewer/Operator and a permission matrix (action x role), admin authentication separate from member authentication with no shared password (recommend
  a concrete mechanism, e.g. WebAuthn passkeys with a second admin approval for dangerous actions; justify; [V] reachability), session handling (token type, lifetime, rotation, revocation), what is and is not logged (a table: data item, collected?, retention, rationale; IP handling: default is not stored, short-lived rate-limit counters only, state exact design), consistency with member safety in Iran. State what the platform can NOT promise.

  '
inputs:
- from: C-000
  kind: contract
  contract: spec/00-conventions.md fixes entity names, ID formats, enums, state names, parameter names (snake_case, prefix by area), API prefix /v1, evidence-tag usage and cross-reference style. Use them exactly; if one is wrong or missing call cell_signal feedback, do not invent a variant.
after:
- C-000
read:
- docs/decisions.md
- docs/source/Hamyar - Founding Document.md
- docs/source/prompt.md
- spec/00-conventions.md
allowed_paths:
- spec/10a-identity.md
outputs:
- spec/10a-identity.md
acceptance:
- cmd: python scripts/check_spec.py spec/10a-identity.md --min-lines 250 --min-tags 8 --require 'recovery key' --require 'permission matrix' --require 'retention'
notes: 'Document cell: write markdown only, in several appends/commits. Do not summarize away required items; every bullet of the named prompt scope letters must appear as a decision, table, schema, pseudocode or Given/When/Then. Founding Document section numbers are §N. Mark facts you cannot know [V].'
