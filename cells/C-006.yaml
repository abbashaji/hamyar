id: C-006
title: 'Section 6b: admission control and capacity'
type: normal
priority: 5
goal: 'Write spec/06b-admission.md (prompt scope C admission control): capacity forecasting from recent verified throughput and active donors (define ''active donor'', window, estimator, safety margin parameters, per-category supply gauge feeding the quote per FD§5.7(8)), phi, quoting a completion window, accept / later quote / waitlist decision, capacity reservations for future dates (booking, escrow at booking, release/expiry interplay), fairness rules (per-member concurrent job cap, first-come within deadline class, deadline-class multipliers fixed 1.0 but configurable), cancellation and refunds, behaviour when forecast drops after acceptance, Commons share (1-phi) preserved. Algorithms in pseudocode, a worked numeric example, and the FD§3.3 admission example (40 donors x 8 cells x 2 days x 0.5 = 320 >= 264) specified as an automated test. Property-based test properties for admission control. All parameters named per 00-conventions.md.

  '
inputs:
- from: C-000
  kind: contract
  contract: spec/00-conventions.md fixes entity names, ID formats, enums, state names, parameter names (snake_case, prefix by area), API prefix /v1, evidence-tag usage and cross-reference style. Use them exactly; if one is wrong or missing call cell_signal feedback, do not invent a variant.
after:
- C-000
read:
- docs/decisions.md
- docs/source/Hamyar - Founding Document.md
- docs/source/prompt.md
- spec/00-conventions.md
allowed_paths:
- spec/06b-admission.md
outputs:
- spec/06b-admission.md
acceptance:
- cmd: python scripts/check_spec.py spec/06b-admission.md --min-lines 220 --min-tags 8 --require '320' --require '264' --require 'waitlist' --require 'pseudocode'
notes: 'Document cell: write markdown only, in several appends/commits. Do not summarize away required items; every bullet of the named prompt scope letters must appear as a decision, table, schema, pseudocode or Given/When/Then. Founding Document section numbers are §N. Mark facts you cannot know [V].'
