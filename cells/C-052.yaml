id: C-052
title: 'Audit A11: 12-public-growth, 13-measurement'
type: normal
priority: 5
goal: 'You are an INDEPENDENT adversarial reviewer of the files listed below (spec parts of the Hamyar Product Specification, written by other agents). Task statement: docs/source/prompt.md; source of truth: the Founding Document (FD); shared names: spec/00-conventions.md (S0). Method: read your files completely in chunks; for each checklist item below look for concrete defects (wrong arithmetic, contradiction inside the file or with S0/FD, missing required content from the prompt scope named, ground-rule violation, untestable criterion, unlabeled number, invented provider/legal fact, name that S0 does not define). FIX each defect you can with a minimal edit in place (apply_changes edits, never whole-file rewrites; keep every ID, endpoint, parameter and state name). Defects that need a change in another file, or a decision only the owner can make, are LOGGED, not worked around. Write the log docs/audit/A11.md with: ''## Checked'' (bullets: what you examined and found correct, so the reader knows coverage), ''## Findings'' (table columns exactly: # | severity (blocking/major/minor) | file:line | defect | action (fixed / logged-cross-part / logged-needs-owner) ), ''## Not verified'' (what you could not check), and a last line ''Verdict: READY'' or ''Verdict: READY WITH LOGGED ITEMS'' or ''Verdict: NOT READY'' (NOT READY if any blocking finding is unfixed). Do not praise; do not pad; if you find nothing in an area say what you checked. Cap: fix at most the 25 most severe defects; log the rest as a count with the top 5.

  FILES UNDER AUDIT: spec/12-public-growth.md, spec/13-measurement.md

  CHECKLIST:

  - Measurement: every Phase 1 measure of FD section 9 has an exact definition, query or pseudocode, cadence and bias note: deposit-to-withdrawal ratio, time to complete a large job vs quote, rejection overall and by template, false-reject, false-accept, v and eta, week-2 and week-4 return, time to first verified cell, share of contributions under 60 seconds, capacity concentration (top 10%), decline and opt-out rates, incidents. Check each definition against the FD wording.

  - Pre-registration: thresholds and decision rules recorded and LOCKED before launch (hash, timestamp, what may change after lock); the accelerated-expiry arm and other arms are configuration with random assignment that is logged; the calibration tool records cells per day per service, seconds per cell, refusal and failure rates, copy-paste error rate.

  - Analytics privacy: aggregate by default, no third-party trackers, minimal retention, small-cell suppression.

  - Growth: V1-V6 are feature-flagged, instrumented, randomizable with a logged assignment; share cards carry no personal data or location; teams are opt-in; referral anti-farming is concrete; nothing moves money; statements about what 30-50 members can show are honest.

  '
