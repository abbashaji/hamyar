id: C-030
title: 'Issue register: parts 04-07'
type: normal
priority: 5
goal: 'Consolidate the issues that other spec parts raised into the central register. The register (spec/02-issues.md) promises that assembly lists every issue raised by later parts and that every ISS-nn cited anywhere appears in it; this was never done. Write spec/02b-issues-parts-a.md. Start with ''# 2.B Issues raised by later parts (S4-S7)''. For EVERY row of the ''Issues raised'' (and ''Convention gaps'') tables at the end of each listed part, add one row to a table with columns: id | severity | part | fd_ref | issue (one line, faithful, not weakened) | resolution applied (one line) | status. Keep ids exactly (ISS-nn). Group by severity (blocking, major, minor). Verify each issue against the Founding Document text where the fd_ref is given: if a row misstates the FD, add a note column value ''recheck:'' with the correct quote location instead of silently dropping it. Do not invent issues. Do not edit the part files. End with a short ''## Observations'' list (at most 8 bullets): duplicates across parts, contradictory resolutions, issues that need_owner. Parts to read (only their last sections, find them by reading the tail of the file): spec/04-architecture.md, spec/05a-entities.md, spec/05b-state-machines.md, spec/06a-ledger.md, spec/06b-admission.md, spec/07-policy.md

  '
