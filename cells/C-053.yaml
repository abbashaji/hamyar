goal: 'You are an INDEPENDENT adversarial reviewer of the files listed below (spec parts of the Hamyar Product Specification, written by other agents). Task statement: docs/source/prompt.md; source of truth: the Founding Document (FD); shared names: spec/00-conventions.md (S0). Method: read your files completely in chunks; for each checklist item below look for concrete defects (wrong arithmetic, contradiction inside the file or with S0/FD, missing required content from the prompt scope named, ground-rule violation, untestable criterion, unlabeled number, invented provider/legal fact, name that S0 does not define). FIX each defect you can with a minimal edit in place (apply_changes edits, never whole-file rewrites; keep every ID, endpoint, parameter and state name). Defects that need a change in another file, or a decision only the owner can make, are LOGGED, not worked around. Write the log docs/audit/A12.md with: ''## Checked'' (bullets: what you examined and found correct, so the reader knows coverage), ''## Findings'' (table columns exactly: # | severity (blocking/major/minor) | file:line | defect | action (fixed / logged-cross-part / logged-needs-owner) ), ''## Not verified'' (what you could not check), and a last line ''Verdict: READY'' or ''Verdict: READY WITH LOGGED ITEMS'' or ''Verdict: NOT READY'' (NOT READY if any blocking finding is unfixed). Do not praise; do not pad; if you find nothing in an area say what you checked. Cap: fix at most the 25 most severe defects; log the rest as a count with the top 5.

  FILES UNDER AUDIT: spec/15a-api-core.md, spec/15b-api-admin.md

  CHECKLIST:

  - Every endpoint table row has method, path under /v1, auth, request, response, errors, idempotency, pagination, rate-limit class; the error model and code catalogue are complete and every code used in a row exists in the catalogue.

  - Member and admin authentication are separate (no admin endpoint accepts a member key and vice versa); step-up approvals for dangerous actions; no endpoint stores or accepts provider credentials or chat-page content.

  - Request and response schemas are valid and consistent with entities (spec/05a-entities.md field names; read the entity headings) and with S0; the three worked examples are consistent with their tables.

  - Endpoints that create jobs, admit members, mint or lease check launch gates and kill switches (spec/14-launch-gates.md); idempotent writes have defined replay behaviour; pagination is cursor-based and stable.

  - Event model lists every domain event with payload, producer and consumers. NOTE: other cells add endpoints in spec/15c..15g; do not add endpoints yourself, only fix this file''s defects.

  '
