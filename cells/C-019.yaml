id: C-019
title: 'Section 14: launch gates as a product feature'
type: normal
priority: 8
goal: 'Write spec/14-launch-gates.md (prompt top constraint + FD§8.3): BUILDING vs LAUNCHING separation as product features: Service Registry ships all services ''unreviewed'' (unreviewed = no); a job cannot be created for a service unless a reviewer recorded the registry flags with a saved terms copy; a global ''members may join'' switch off until the gate checklist is signed off in the admin tool. Specify: LaunchGateItem data model and states for G0..G5 broken into concrete checklist items (G0 per-service questions (a)-(k) and counsel questions, G1 threat-model artifacts, G2 feasibility measurements, G3 calibration, G4 repo review and secret rotation, G5 demand check), evidence attachments, who may sign off (roles, two-person rule), sign-off immutability and expiry/re-validation (e.g. terms changed), the exit rule of FD§8.3 encoded as a machine check, the global switches (members_may_join, jobs_may_be_created, minting_enabled, plus per-service/template/member kill switches) and exactly
  which server code paths check them (list of enforcement points, fail-closed default), screens (checklist, sign-off, switch panel) wire-level, tests (table of Given/When/Then incl. ''fresh database => nobody can join, no job creatable'', ''service revoked mid-flight''), audit log. Fallbacks (i)-(iv) as recorded decisions in the tool. Make clear that these gates control the software and do not substitute for legal advice [V].

  '
inputs:
- from: C-000
  kind: contract
  contract: spec/00-conventions.md fixes entity names, ID formats, enums, state names, parameter names (snake_case, prefix by area), API prefix /v1, evidence-tag usage and cross-reference style. Use them exactly; if one is wrong or missing call cell_signal feedback, do not invent a variant.
after:
- C-000
read:
- docs/decisions.md
- docs/source/Hamyar - Founding Document.md
- docs/source/prompt.md
- docs/source/panel-review.md
- spec/00-conventions.md
allowed_paths:
- spec/14-launch-gates.md
outputs:
- spec/14-launch-gates.md
acceptance:
- cmd: python scripts/check_spec.py spec/14-launch-gates.md --min-lines 220 --min-tags 8 --require 'members_may_join' --require 'fail-closed' --require 'Given'
notes: 'Document cell: write markdown only, in several appends/commits. Do not summarize away required items; every bullet of the named prompt scope letters must appear as a decision, table, schema, pseudocode or Given/When/Then. Founding Document section numbers are §N. Mark facts you cannot know [V].'
