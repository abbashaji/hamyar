goal: 'You apply a fixed list of audit findings to spec parts and write docs/fix/R4-12.md. SOURCES: docs/audit/FINAL-3.md (the ''Findings'' table; rows 1-51: each row you are assigned states file:line, defect and the proposed fix; READ each of your rows first), docs/owner-decisions.md (the owner''s accepted decisions D-01..D-38: they are binding, apply them, never invent another choice), and the parts named below. AUTHORITY WHEN SOURCES CONFLICT: docs/owner-decisions.md, then the Founding Document, then S0 (spec/00-conventions.md), then the part that owns the concept per D-30 (entities and columns: S5a; enums and states: S0; operations and paths: S15a/S15b; copy keys for requester rejections: S7), then all other parts. METHOD: for each assigned row, locate the cited text by reading about 30 lines around the cited line (lines drift; search nearby, never guess); make the MINIMAL edit in place (apply_changes with small old/new strings; never rewrite sections, never delete content that is not part of the fix); after an edit, check that every other place in YOUR files that states the same fact now agrees (search by reading the neighbouring sections and any table that repeats it); do not touch anything not named by your rows; if you notice another defect list it under ''## Noticed, not fixed'' with file:line and do not fix it. Names: edits may change only the identifiers your row says to change; never rename any other id, parameter, endpoint, state or enum; never mention retired names in the new text. If an edit would contradict the Founding Document, a ground rule of docs/decisions.md or a decision of docs/owner-decisions.md, do not make it: record skipped-needs-owner with the reason. STATUS WORDS: applied / already-applied / skipped-needs-owner / skipped-not-found (with what you searched). LOG docs/fix/R4-12.md: a table with columns exactly: edit | file:line | before | after | status (one row per edit, row numbers of FINAL-3 in the first column), then ''## Read-back'' (after ALL edits re-open every edited place and state in a phrase what you now read; also state, for each row, which other places you checked for the same fact), then ''## Noticed, not fixed'', then a last line ''Result: DONE'' or ''Result: DONE WITH SKIPS''. Mark every edit that follows a decision as default-pending in the ''after'' column. Do not run anything; CI runs the acceptance commands.


  TASK R4-12: Rows 20, 30, 32, 33, 43, 44, 45, 46, 47, 48, 51. Row 20: 11b AC-req-57 shows the stored rating and stays editable until the window ends (as AC-req-58); align SCR-req-17 entry conditions. Row 30: add `requester_rated_at` to 05a Job (timestamp, null until rated) so that `Job.rating` `{score, updated_at}` of 15a has a stored source; 15a unchanged unless it disagrees. Row 32: 09 convention additions list only `submitResult` and `rotateLeaseNonce` (no validation endpoint exists, 9.5.4). Row 33: 13 `lock_approvals`: state it is written once at execution with the two approver action ids and the approved hash (the open approval lives in AdminApproval). Row 43: 02f header and counts line include 2.F.5; counts equal the ids of the file. Row 44: locate the two stale sentences in 15d (15.C.6 event bullet saying `experiment.assigned` is absent) and 15c (15.B.9 Events row calling `member.recovery_confirmed` a convention gap) and align them with 15b 15.34.4 and 15.34.6. Row 45: apply the R3-13 edits 25 and 27 intent in 15c: the `perm.screening.read` and `perm.screening.decide` rows in 15b 15.21.4 and the 15c lines they require; read 11a and the other citing parts to check that no part cites a path with verdict REMOVE. Row 46: rename the heading of 15b 15.34.4 to cover calibration, decision-report, incident, interview and experiment events too. Row 47: in 19 prefix bare `OD-nn` ids with `S19` in the paragraph near 19.1 and search 19.2..19.8 for bare ids (prose never writes a bare id). Row 48: 03 3.6 says `OD-01` to `OD-31` of this part, of which only `OD-01` to `OD-14` have a row in this table. Row 51: in docs/fix/R3-02.md, R3-07.md, R3-14.md, R3-15.md add under the table a line ''Offset note (round 4): line citations in this log drift by up to 30 lines against the final files'' and correct the two false read-back sentences (R3-14: 08b has 687 lines and its range was 1-583; R3-15: ISS-17003 is not read in 11.87 row S10, which has no issue id). Do not edit anything else in those logs.

