id: C-010
title: 'Section 9: result return, anti-forgery, abuse defenses'
type: normal
priority: 5
goal: 'Write spec/09-result-return.md (prompt scope E result return and anti-forgery + D abuse defenses as they apply on return): server-issued cell IDs, lease-bound nonces (generation, binding, single use, expiry), size limits, schema validation, escaping everything on display (per output context), never executing submitted content, rate limits, duplicate-submission handling (idempotent resubmit vs conflicting), detection of copy-paste of another donor''s output (hash/near-duplicate comparison; limits), timing anomalies (min plausible time, lease-to-submit distribution; limits), output flagging (links, code to run, requests for action -> flagged not accepted), attested service/model fields (self-reported, [V] not proof), abuse of paste-back for XSS/injection (test list), what the paste-back form accepts. Provide the submit endpoint processing as pseudocode with every check in order and its reject code, plus an adversarial test table (forgery, replay, double submission, cross-lease nonce
  reuse, oversized, script/HTML injection, RTL override characters, zero-width characters). Persian/mixed-direction text handling in stored and displayed outputs (Unicode normalization policy, bidi control characters policy).

  '
inputs:
- from: C-000
  kind: contract
  contract: spec/00-conventions.md fixes entity names, ID formats, enums, state names, parameter names (snake_case, prefix by area), API prefix /v1, evidence-tag usage and cross-reference style. Use them exactly; if one is wrong or missing call cell_signal feedback, do not invent a variant.
after:
- C-000
read:
- docs/decisions.md
- docs/source/Hamyar - Founding Document.md
- docs/source/prompt.md
- spec/00-conventions.md
allowed_paths:
- spec/09-result-return.md
outputs:
- spec/09-result-return.md
acceptance:
- cmd: python scripts/check_spec.py spec/09-result-return.md --min-lines 220 --min-tags 8 --require 'nonce' --require 'XSS' --require 'replay'
notes: 'Document cell: write markdown only, in several appends/commits. Do not summarize away required items; every bullet of the named prompt scope letters must appear as a decision, table, schema, pseudocode or Given/When/Then. Founding Document section numbers are §N. Mark facts you cannot know [V].'
