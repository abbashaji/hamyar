dits re-open every edited place and state in a phrase what you now read; also state, for each row, which other places you checked for the same fact), then ''## Noticed, not fixed'', then a last line ''Result: DONE'' or ''Result: DONE WITH SKIPS''. Mark every edit that follows a decision as default-pending in the ''after'' column. Do not run anything; CI runs the acceptance commands.


  TASK R3-09: Rows 17, 18, 20, 64 with D-03, D-04, D-26. Row 17: three places still say the levy pays for verification (6.7.3 properties and the N = 7 example ~:359-362, the 6.11.2 cap row ~:506, the `ISS-61` resolution ~:880): rewrite them to the hard-pool rule (ISS-16, LD-05, 6.7.2: the levy budget never pays verification; the job stops when the pool cannot pay), and make the 6.7.3 N = 7 example agree with `AC-ledger-03(b)`; recompute the arithmetic by hand in your Read-back. Row 18 (D-26): rewrite the payout-guard text at 6.x ~:299 and ~:149-156: acceptance is deferred (`acceptance_deferred_until`, 05b) and at the end of the deferral the job stops with `funding_shortfall` (S0 0.9.2, added by R3-07; read S0 and 05b first); nothing is silently rolled back. Row 20 (D-04): state the small-job consequence in 06a 6.x near :761 and in the quote section: a job whose N x v is below one credit cannot pay a verification cell, so its first mandatory verification event stops it with partial results (show the N = 7 case) and the quote must say so before escrow; add one Given/When/Then. Row 64 (D-03): the 6.6.3 row for a `transfer` into a closed escrow posts NO restitution (default: the donor bears the gap) and INV-L15 no longer allows restitution reversals; edit the row, INV-L15 and any worked example that uses restitution. If an edit in 05b is needed for consistency, make it minimal and log it.

