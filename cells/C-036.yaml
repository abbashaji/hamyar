goal: 'Read spec/16-parameters.md, spec/16b-parameters-a.md, spec/16c-parameters-b.md and the parameter sections of spec/00-conventions.md (0.10). Write spec/16d-parameter-consistency.md (''# 16.D Parameter consistency''): (1) a table of validation RELATIONS across all parameters (for example phi < 1; audit floor <= audit rate; lease timeout vs envelope time; credit lifetime vs reservation horizon; cap K vs a typical large job; levy plus v bound on eta; referral draw vs Reserve; rate limits ordering device < tree < day) each with the formula, the parameters involved, and the write-time validator behaviour; check that the initial defaults in the three tables SATISFY every relation (do the arithmetic; report violations as findings with a corrected default and the reason); (2) duplicates and aliases across the three tables, resolved to one canonical name; (3) defaults that conflict with what an earlier part states (read the part when two tables disagree); (4) the FD section 4.9 cross-check: every FD parameter maps to exactly one canonical name; (5) a list of parameters whose default is a safety-critical fail-closed value, and one that is not safe to loosen without notice. Do not edit other files; where a table must change, state the exact correction in your file and call it out under ''## Corrections required''.

