title: 'Audit A13: 16-parameters, 19-risks, 01-purpose, 03-assumptions, 20-glossary, 21-persian-summary'
type: normal
priority: 5
goal: 'You are an INDEPENDENT adversarial reviewer of the files listed below (spec parts of the Hamyar Product Specification, written by other agents). Task statement: docs/source/prompt.md; source of truth: the Founding Document (FD); shared names: spec/00-conventions.md (S0). Method: read your files completely in chunks; for each checklist item below look for concrete defects (wrong arithmetic, contradiction inside the file or with S0/FD, missing required content from the prompt scope named, ground-rule violation, untestable criterion, unlabeled number, invented provider/legal fact, name that S0 does not define). FIX each defect you can with a minimal edit in place (apply_changes edits, never whole-file rewrites; keep every ID, endpoint, parameter and state name). Defects that need a change in another file, or a decision only the owner can make, are LOGGED, not worked around. Write the log docs/audit/A13.md with: ''## Checked'' (bullets: what you examined and found correct, so the reader knows coverage), ''## Findings'' (table columns exactly: # | severity (blocking/major/minor) | file:line | defect | action (fixed / logged-cross-part / logged-needs-owner) ), ''## Not verified'' (what you could not check), and a last line ''Verdict: READY'' or ''Verdict: READY WITH LOGGED ITEMS'' or ''Verdict: NOT READY'' (NOT READY if any blocking finding is unfixed). Do not praise; do not pad; if you find nothing in an area say what you checked. Cap: fix at most the 25 most severe defects; log the rest as a count with the top 5.

  FILES UNDER AUDIT: spec/16-parameters.md, spec/19-risks.md, spec/01-purpose.md, spec/03-assumptions.md, spec/20-glossary.md, spec/21-persian-summary.md

  CHECKLIST:

  - Parameter table: for ten parameters of your choice that matter most (cell envelope, K, E, lambda, phi, g, s, G, mint cap, lease timeout) verify validation, default label (''initial configurable default''), calibration measurement, change policy; verify relations (phi < 1, audit floor <= audit rate, etc.) and report violations. (Other cells add missing names in spec/16b..16d; do not add names yourself.)

  - Risks: extends FD 8.2; qualitative likelihood and impact only (no invented numbers); every [V] item points to a place in the system where the answer is stored; pre-build checklist separates before coding, before first member, before public exposure.

  - Purpose and assumptions: the evidence-tag legend is complete; every assumption has a default; owner-only decisions are listed (jurisdiction, reviewers, hosting, entity form, name).

  - Glossary: terms used in the spec but missing from it (sample at least 25 technical terms from the other parts'' headings); Persian summary: about 10 lines, natural Persian, uses declared (اعلام‌شده), mentions the build-versus-launch separation and unverified legal and provider-terms items, marked for human review.

  '
